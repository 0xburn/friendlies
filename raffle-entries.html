<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Friendlies Raffle Entries</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f1117;
    color: #e1e4e8;
    padding: 2rem;
  }
  .container { max-width: 640px; margin: 0 auto; }
  h1 {
    font-size: 1.6rem;
    font-weight: 700;
    margin-bottom: 0.25rem;
    color: #fff;
  }
  .subtitle {
    color: #8b949e;
    font-size: 0.9rem;
    margin-bottom: 1.5rem;
  }
  .stats {
    display: flex;
    gap: 1rem;
    margin-bottom: 1.5rem;
  }
  .stat-card {
    flex: 1;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 10px;
    padding: 1rem;
    text-align: center;
  }
  .stat-card .num {
    font-size: 1.8rem;
    font-weight: 700;
    color: #58a6ff;
  }
  .stat-card .label {
    font-size: 0.75rem;
    color: #8b949e;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-top: 0.2rem;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background: #161b22;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid #30363d;
  }
  thead th {
    text-align: left;
    padding: 0.75rem 1rem;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #8b949e;
    background: #1c2129;
    border-bottom: 1px solid #30363d;
  }
  thead th:last-child { text-align: right; }
  tbody tr { border-bottom: 1px solid #21262d; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #1c2129; }
  tbody td {
    padding: 0.6rem 1rem;
    font-size: 0.9rem;
  }
  .rank {
    color: #8b949e;
    font-size: 0.8rem;
    width: 2.5rem;
  }
  .code {
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-weight: 600;
    color: #f0f6fc;
  }
  .entries {
    text-align: right;
    font-weight: 700;
    font-family: 'SF Mono', 'Fira Code', monospace;
  }
  .bar-cell { width: 40%; }
  .bar-bg {
    background: #21262d;
    border-radius: 4px;
    height: 8px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    border-radius: 4px;
    background: linear-gradient(90deg, #388bfd, #58a6ff);
  }
  .top3 .code { color: #ffd700; }
  .top3 .bar-fill { background: linear-gradient(90deg, #d4a017, #ffd700); }
</style>
</head>
<body>
<div class="container">
  <h1>Friendlies Raffle Entries</h1>
  <p class="subtitle">April 7, 2026 (UTC/EST/PST) — Cashbox opens (x3, deduped by opponent) + invite_both_opened + invite_opened_melee + invite_sent + nudge_sent</p>
  <div class="stats" id="stats"></div>
  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>Connect Code</th>
        <th class="bar-cell"></th>
        <th>Entries</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

const max = data[0][1];
const totalEntries = data.reduce((s, r) => s + r[1], 0);
const totalPlayers = data.length;

document.getElementById('stats').innerHTML = `
  <div class="stat-card"><div class="num">${totalPlayers}</div><div class="label">Players</div></div>
  <div class="stat-card"><div class="num">${totalEntries}</div><div class="label">Total Entries</div></div>
  <div class="stat-card"><div class="num">${max}</div><div class="label">Most Entries</div></div>
`;

const tbody = document.getElementById('tbody');
data.forEach(([code, entries], i) => {
  const pct = (entries / max * 100).toFixed(1);
  const top3 = i < 3 ? ' top3' : '';
  tbody.innerHTML += `<tr class="${top3}">
    <td class="rank">${i + 1}</td>
    <td class="code">${code}</td>
    <td class="bar-cell"><div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div></td>
    <td class="entries">${entries}</td>
  </tr>`;
});
</script>
</body>
</html>
